# Sends today's door every morning in December: WhatsApp + LinkedIn, logged as a GitHub issue.
# 07:17 UTC = 08:17 in Europe/Rome (CET, UTC+1, all of December). Off the hour on purpose:
# scheduled runs on the hour are the most likely to be delayed.
name: Daily alert

on:
  schedule:
    - cron: "17 7 1-31 12 *"
  workflow_dispatch:
    inputs:
      day:
        description: "Door number to send (leave blank for today)"
        required: false
        default: ""
      mode:
        description: "full (31 days) or advent (24 doors); blank = config/alerts.json"
        required: false
        default: ""
      dry_run:
        description: "Dry run: print the messages, send nothing"
        type: boolean
        default: true
      force:
        description: "Send even if this door was already sent"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: daily-alert
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: alerts
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Inputs reach the script through env, never interpolated into the shell (OWASP A05:2025 Injection).
      - name: Send today's door
        env:
          INPUT_DAY: ${{ inputs.day }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_FORCE: ${{ inputs.force }}
          GITHUB_TOKEN: ${{ github.token }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_RECIPIENTS: ${{ secrets.WHATSAPP_RECIPIENTS }}
          WHATSAPP_RECIPIENTS_LEADERS: ${{ secrets.WHATSAPP_RECIPIENTS_LEADERS }}
          WHATSAPP_RECIPIENTS_IT: ${{ secrets.WHATSAPP_RECIPIENTS_IT }}
          WHATSAPP_RECIPIENTS_DEV: ${{ secrets.WHATSAPP_RECIPIENTS_DEV }}
          WHATSAPP_RECIPIENTS_HR: ${{ secrets.WHATSAPP_RECIPIENTS_HR }}
          WHATSAPP_RECIPIENTS_FINANCE: ${{ secrets.WHATSAPP_RECIPIENTS_FINANCE }}
          WHATSAPP_RECIPIENTS_LEGAL: ${{ secrets.WHATSAPP_RECIPIENTS_LEGAL }}
          WHATSAPP_RECIPIENTS_MARKETING: ${{ secrets.WHATSAPP_RECIPIENTS_MARKETING }}
          WHATSAPP_RECIPIENTS_SUPPORT: ${{ secrets.WHATSAPP_RECIPIENTS_SUPPORT }}
          WHATSAPP_RECIPIENTS_PROCUREMENT: ${{ secrets.WHATSAPP_RECIPIENTS_PROCUREMENT }}
          WHATSAPP_RECIPIENTS_HOME: ${{ secrets.WHATSAPP_RECIPIENTS_HOME }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
        run: python3 scripts/notify.py
